<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">和风天气控制台查找 API Host 的示例图</title>
  <desc id="desc">示例页面标出账户设置中的 API Host 和复制按钮，并说明只复制域名。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#09101f" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e45b42"/></marker>
  </defs>
  <rect width="1280" height="760" rx="22" fill="#eef3f8"/>
  <rect width="1280" height="72" rx="22" fill="#132238"/>
  <rect y="50" width="1280" height="22" fill="#132238"/>
  <text x="42" y="47" fill="#fff" font-size="27" font-family="Microsoft YaHei, sans-serif" font-weight="700">和风天气控制台</text>
  <text x="1015" y="44" fill="#b8c7dc" font-size="18" font-family="Microsoft YaHei, sans-serif">示例页面 · 假数据</text>
  <rect x="28" y="103" width="260" height="620" rx="14" fill="#fff" filter="url(#shadow)"/>
  <text x="62" y="151" fill="#66758a" font-size="17" font-family="Microsoft YaHei, sans-serif">账户</text>
  <rect x="48" y="181" width="220" height="59" rx="10" fill="#eaf2ff"/>
  <text x="76" y="218" fill="#1c5db5" font-size="21" font-family="Microsoft YaHei, sans-serif" font-weight="700">设置</text>
  <circle cx="56" cy="211" r="20" fill="#e45b42"/><text x="56" y="219" text-anchor="middle" fill="#fff" font-size="18" font-family="Arial" font-weight="700">1</text>
  <text x="62" y="284" fill="#66758a" font-size="17" font-family="Microsoft YaHei, sans-serif">项目管理</text>
  <text x="62" y="332" fill="#66758a" font-size="17" font-family="Microsoft YaHei, sans-serif">用量与账单</text>
  <rect x="326" y="103" width="926" height="620" rx="14" fill="#fff" filter="url(#shadow)"/>
  <text x="365" y="153" fill="#2b3d55" font-size="18" font-family="Microsoft YaHei, sans-serif">账户设置  /  API Host</text>
  <text x="365" y="208" fill="#182a43" font-size="31" font-family="Microsoft YaHei, sans-serif" font-weight="700">API Host</text>
  <text x="365" y="249" fill="#718096" font-size="17" font-family="Microsoft YaHei, sans-serif">每个账号的专属 API 域名（以下内容为示例）</text>
  <rect x="365" y="289" width="828" height="210" rx="11" fill="#f7f9fc" stroke="#d9e1ec" stroke-width="2"/>
  <text x="405" y="345" fill="#526276" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="700">你的 API Host</text>
  <rect x="405" y="372" width="620" height="58" rx="8" fill="#fff" stroke="#8fb4df" stroke-width="3"/>
  <text x="431" y="409" fill="#233a58" font-size="20" font-family="Consolas, Microsoft YaHei, sans-serif">h2a9cf3mhs.xy.qweatherapi.com</text>
  <rect x="1045" y="372" width="111" height="58" rx="8" fill="#1c75d8"/>
  <text x="1101" y="409" text-anchor="middle" fill="#fff" font-size="19" font-family="Microsoft YaHei, sans-serif" font-weight="700">复制</text>
  <circle cx="1060" cy="344" r="20" fill="#e45b42"/><text x="1060" y="352" text-anchor="middle" fill="#fff" font-size="18" font-family="Arial" font-weight="700">2</text>
  <line x1="1060" y1="364" x2="1060" y2="370" stroke="#e45b42" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="385" cy="401" r="20" fill="#e45b42"/><text x="385" y="409" text-anchor="middle" fill="#fff" font-size="18" font-family="Arial" font-weight="700">3</text>
  <line x1="405" y1="401" x2="425" y2="401" stroke="#e45b42" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="365" y="540" width="828" height="134" rx="11" fill="#fff4d9" stroke="#efc66a" stroke-width="2"/>
  <text x="397" y="581" fill="#765b18" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="700">复制时只要这一段域名</text>
  <text x="397" y="618" fill="#765b18" font-size="17" font-family="Microsoft YaHei, sans-serif">正确：h2a9cf3mhs.xy.qweatherapi.com</text>
  <text x="397" y="650" fill="#9b4d35" font-size="17" font-family="Microsoft YaHei, sans-serif">不要带：https://、/v7/weather/now、端口号或 API KEY</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">和风天气控制台创建 API KEY 的示例图</title>
  <desc id="desc">示例页面标出项目管理、凭据设置、创建凭据、API KEY、凭据名称和创建按钮的位置。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#09101f" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e45b42"/></marker>
  </defs>
  <rect width="1280" height="760" rx="22" fill="#eef3f8"/>
  <rect width="1280" height="72" rx="22" fill="#132238"/>
  <rect y="50" width="1280" height="22" fill="#132238"/>
  <text x="42" y="47" fill="#fff" font-size="27" font-family="Microsoft YaHei, sans-serif" font-weight="700">和风天气控制台</text>
  <text x="1015" y="44" fill="#b8c7dc" font-size="18" font-family="Microsoft YaHei, sans-serif">示例页面 · 假数据</text>
  <rect x="28" y="103" width="260" height="620" rx="14" fill="#fff" filter="url(#shadow)"/>
  <text x="62" y="151" fill="#66758a" font-size="17" font-family="Microsoft YaHei, sans-serif">控制台</text>
  <rect x="48" y="181" width="220" height="59" rx="10" fill="#eaf2ff"/>
  <text x="76" y="218" fill="#1c5db5" font-size="21" font-family="Microsoft YaHei, sans-serif" font-weight="700">项目管理</text>
  <circle cx="56" cy="211" r="20" fill="#e45b42"/><text x="56" y="219" text-anchor="middle" fill="#fff" font-size="18" font-family="Arial" font-weight="700">1</text>
  <text x="62" y="284" fill="#66758a" font-size="17" font-family="Microsoft YaHei, sans-serif">账户设置</text>
  <text x="62" y="332" fill="#66758a" font-size="17" font-family="Microsoft YaHei, sans-serif">用量与账单</text>
  <rect x="326" y="103" width="926" height="620" rx="14" fill="#fff" filter="url(#shadow)"/>
  <text x="365" y="153" fill="#2b3d55" font-size="18" font-family="Microsoft YaHei, sans-serif">项目管理  /  示例项目  /  凭据设置</text>
  <text x="365" y="208" fill="#182a43" font-size="31" font-family="Microsoft YaHei, sans-serif" font-weight="700">凭据设置</text>
  <text x="365" y="249" fill="#718096" font-size="17" font-family="Microsoft YaHei, sans-serif">为这个项目创建访问凭据（以下内容均为示例）</text>
  <rect x="1015" y="184" width="178" height="55" rx="9" fill="#e45b42"/>
  <text x="1104" y="219" text-anchor="middle" fill="#fff" font-size="20" font-family="Microsoft YaHei, sans-serif" font-weight="700">创建凭据</text>
  <circle cx="988" cy="211" r="20" fill="#e45b42"/><text x="988" y="219" text-anchor="middle" fill="#fff" font-size="18" font-family="Arial" font-weight="700">2</text>
  <line x1="969" y1="211" x2="900" y2="211" stroke="#e45b42" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="365" y="289" width="828" height="334" rx="11" fill="#f7f9fc" stroke="#d9e1ec" stroke-width="2"/>
  <text x="405" y="335" fill="#2b3d55" font-size="18" font-family="Microsoft YaHei, sans-serif" font-weight="700">新建凭据</text>
  <text x="405" y="387" fill="#526276" font-size="17" font-family="Microsoft YaHei, sans-serif">凭据名称</text>
  <rect x="595" y="353" width="517" height="51" rx="7" fill="#fff" stroke="#b9c8da" stroke-width="2"/>
  <text x="619" y="386" fill="#2b3d55" font-size="18" font-family="Microsoft YaHei, sans-serif">OwlPost weather demo</text>
  <circle cx="385" cy="378" r="20" fill="#e45b42"/><text x="385" y="386" text-anchor="middle" fill="#fff" font-size="18" font-family="Arial" font-weight="700">3</text>
  <line x1="405" y1="378" x2="575" y2="378" stroke="#e45b42" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="405" y="454" fill="#526276" font-size="17" font-family="Microsoft YaHei, sans-serif">身份认证方式</text>
  <rect x="595" y="420" width="517" height="51" rx="7" fill="#fff" stroke="#b9c8da" stroke-width="2"/>
  <text x="619" y="453" fill="#2b3d55" font-size="18" font-family="Microsoft YaHei, sans-serif">API KEY</text>
  <text x="1072" y="453" fill="#6c7d92" font-size="18" font-family="Arial">▼</text>
  <circle cx="385" cy="445" r="20" fill="#e45b42"/><text x="385" y="453" text-anchor="middle" fill="#fff" font-size="18" font-family="Arial" font-weight="700">4</text>
  <line x1="405" y1="445" x2="575" y2="445" stroke="#e45b42" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="930" y="530" width="182" height="54" rx="8" fill="#1c75d8"/>
  <text x="1021" y="565" text-anchor="middle" fill="#fff" font-size="20" font-family="Microsoft YaHei, sans-serif" font-weight="700">创建</text>
  <circle cx="898" cy="557" r="20" fill="#e45b42"/><text x="898" y="565" text-anchor="middle" fill="#fff" font-size="18" font-family="Arial" font-weight="700">5</text>
  <line x1="918" y1="557" x2="925" y2="557" stroke="#e45b42" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="365" y="651" width="828" height="45" rx="8" fill="#fff4d9" stroke="#efc66a"/>
  <text x="389" y="680" fill="#765b18" font-size="17" font-family="Microsoft YaHei, sans-serif">创建后复制完整 API KEY；只把 Key 填进 OwlPost 的「API Key」框。</text>
</svg>